<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Immo · saved listings</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e6f63'/%3E%3Cpath d='M8 16.5 16 9l8 7.5' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M11 16v7h10v-7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">immo</span>
        <span class="brand-sub">saved listings</span>
      </div>

      <label class="search">
        <span class="search-icon" aria-hidden="true"></span>
        <input
          id="search"
          type="search"
          placeholder="Search address, city, agency, description…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search listings"
        />
        <kbd class="search-hint">/</kbd>
      </label>

      <nav class="tabs" role="tablist" aria-label="View">
        <button class="tab is-active" data-view="map" role="tab" aria-selected="true" type="button">Map</button>
        <button class="tab" data-view="stats" role="tab" aria-selected="false" type="button">Stats</button>
      </nav>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </header>

    <main class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <button id="filters-toggle" class="filters-toggle" type="button" aria-expanded="true">
            <span>Filters</span>
            <span id="filter-badge" class="badge" hidden></span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <select id="sort" class="sort" aria-label="Sort listings"></select>
        </div>
        <div id="filters" class="filters"></div>
        <div class="results-head">
          <span id="result-count" class="result-count">Loading…</span>
          <button id="clear-filters" class="link-button" type="button" hidden>Clear</button>
        </div>
        <div id="results" class="results"></div>
      </aside>

      <section class="stage" id="stage">
        <div id="map" class="map"></div>
        <div id="stats" class="stats" hidden></div>
        <aside id="detail" class="detail" hidden aria-label="Listing details"></aside>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
